kind = "web"
previewPath = "/"
title = "FOCUS — ADHD Planner"
version = "1.0.0"
id = "artifacts/focus-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23244

[services.development]
run = "pnpm --filter @workspace/focus-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/focus-app", "run", "build" ]
publicDir = "artifacts/focus-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23244"
BASE_PATH = "/"
